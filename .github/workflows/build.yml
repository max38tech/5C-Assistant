name: Build iOS Kiosk App (Theos)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang curl git libssl-dev ldid xz-utils

    - name: Install Theos
      run: |
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        echo "THEOS=~/theos" >> $GITHUB_ENV
        echo "~/theos/bin" >> $GITHUB_PATH

    - name: Download iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git ~/theos/sdks

    - name: Build Application (DEB Package)
      run: |
        make package FINALPACKAGE=1

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Antigravity5C-Jailbreak-DEB
        path: packages/*.deb
