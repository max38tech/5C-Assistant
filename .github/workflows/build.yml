name: Build iOS Kiosk App

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install xcodegen
        brew install ldid

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build Application
      run: |
        xcodebuild -project Antigravity5C.xcodeproj \
          -scheme Antigravity5C \
          -configuration Release \
          -sdk iphoneos \
          -arch armv7 -arch arm64 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build \
          CONFIGURATION_BUILD_DIR="$(pwd)/build"

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r build/Antigravity5C.app Payload/
        # Strip code signature requirements for jailbroken devices
        ldid -S Payload/Antigravity5C.app/Antigravity5C || true
        zip -r Antigravity5C.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Antigravity5C-Jailbreak
        path: Antigravity5C.ipa
